name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ESP32-P4 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32p4
          idf.py build
          idf.py merge-bin -o mypi-hotspot-merged.bin
      - name: Upload firmware images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mypi-hotspot-firmware-${{ github.sha }}
          path: |
            build/mypi_hotspot.bin
            build/mypi-hotspot-merged.bin
          if-no-files-found: error
