## Managed components (downloaded by the ESP-IDF component manager at build time)
dependencies:
  idf:
    version: ">=6.1"
  lvgl/lvgl:
    version: "9.4.0"
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "3.0.9"
    rules:
      - if: "target in [esp32p4]"
  espressif/mdns:
    version: "^1.8"
  espressif/cjson:
    version: "^1.7"
  espressif/iperf:
    version: "^1.0"
  # v0.10.0: MIPI-CSI camera (V4L2 + ISP); pulls esp_cam_sensor (OV5647 driver) and esp_ipa.
  espressif/esp_video:
    version: "2.5.*"
    rules:
      - if: "target in [esp32p4]"
